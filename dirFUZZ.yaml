      - "{{BaseURL}}/jwt_private.pem"
      - "{{BaseURL}}/jwt_public.pem"
      - "{{BaseURL}}/private.key"
      - "{{BaseURL}}/public.key"
        
       #micellanous file testing 

      - "{{BaseURL}}/composer.lock"
      - "{{BaseURL}}/composer.json"
      - "{{BaseURL}}/package.json"
      - "{{BaseURL}}/package-lock.json"
      - "{{BaseURL}}/.bash_history"
      - "{{BaseURL}}/.bashrc"
      - "{{BaseURL}}/.zshrc"
      - "{{BaseURL}}/.gitignore"
      - "{{BaseURL}}/.gitconfig"
      - "{{BaseURL}}/.gitattributes"
      - "{{BaseURL}}/.idea/workspace.xml"
