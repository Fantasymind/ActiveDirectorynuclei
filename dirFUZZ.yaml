      - "{{BaseURL}}/connections.ini"
      - "{{BaseURL}}/credentials.json"
      - "{{BaseURL}}/settings.py"
      - "{{BaseURL}}/settings.xml"
      - "{{BaseURL}}/app.config"
      - "{{BaseURL}}/firebase.json"
      - "{{BaseURL}}/aws-credentials"
  
      
      # Environment files
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.dev"
