      - "{{BaseURL}}/.htaccess.old"
      - "{{BaseURL}}/admin.bak"
      - "{{BaseURL}}/backup.zip"
      - "{{BaseURL}}/backup.tar.gz"
      - "{{BaseURL}}/backup.sql"
      - "{{BaseURL}}/backup_old.sql"
      - "{{BaseURL}}/old_version.zip"
      - "{{BaseURL}}/old_config.php"

        # Log and debug files
      - "{{BaseURL}}/error.log"
      - "{{BaseURL}}/debug.log"
      - "{{BaseURL}}/access.log"
      - "{{BaseURL}}/system.log"
      - "{{BaseURL}}/application.log"
      - "{{BaseURL}}/log.txt"

       # Private key
      - "{{BaseURL}}/.ssh/id_rsa"
      - "{{BaseURL}}/.ssh/id_rsa.pub"
      - "{{BaseURL}}/.ssh/id_dsa"
      - "{{BaseURL}}/.ssh/id_ecdsa"
