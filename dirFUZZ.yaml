      - "{{BaseURL}}/config/"
      - "{{BaseURL}}/logs/"
      - "{{BaseURL}}/wp-admin/"
      - "{{BaseURL}}/wp-content/"
      - "{{BaseURL}}/wp-includes/"
      - "{{BaseURL}}/admin.php"
      - "{{BaseURL}}/index.php"
      
      # Top 25 JavaScript Path Files
      - "{{BaseURL}}/js/config.js"
      - "{{BaseURL}}/js/credentials.js"
      - "{{BaseURL}}/js/secrets.js"
      - "{{BaseURL}}/js/keys.js"
      - "{{BaseURL}}/js/password.js"
      - "{{BaseURL}}/js/api_keys.js"
      - "{{BaseURL}}/js/auth_tokens.js"
      - "{{BaseURL}}/js/access_tokens.js"
      - "{{BaseURL}}/js/sessions.js"
      - "{{BaseURL}}/js/authorization.js"
      - "{{BaseURL}}/js/encryption.js"
      - "{{BaseURL}}/js/certificates.js"
      - "{{BaseURL}}/js/ssl_keys.js"
      - "{{BaseURL}}/js/passphrases.js"
      - "{{BaseURL}}/js/policies.js"
      - "{{BaseURL}}/js/permissions.js"
      - "{{BaseURL}}/js/privileges.js"
      - "{{BaseURL}}/js/hashes.js"
      - "{{BaseURL}}/js/salts.js"
      - "{{BaseURL}}/js/nonces.js"
      - "{{BaseURL}}/js/signatures.js"
      - "{{BaseURL}}/js/digests.js"
      - "{{BaseURL}}/js/tokens.js"
      - "{{BaseURL}}/js/cookies.js"
      -  "{{BaseURL}}.jstopsecr3tdonotlook.js"

      # Git and SVN related paths
      - "{{BaseURL}}/.git"
      - "{{BaseURL}}/.gitkeep"
      - "{{BaseURL}}/.git-rewrite"
      - "{{BaseURL}}/.gitreview"
      - "{{BaseURL}}/.git/HEAD"
