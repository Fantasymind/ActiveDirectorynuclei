id: directory-fuzzing

info:
  name: Directory Fuzzing with Sensitive  Paths and configfile
  author: Farrel Madyastha Widyadhana 
  severity: info
  tags: directory, fuzzing, config

requests:
  - method: GET
    path:
      - "{{BaseURL}}/admin/"
      - "{{BaseURL}}/uploads/"
      - "{{BaseURL}}/images/"
      - "{{BaseURL}}/files/"
      - "{{BaseURL}}/backup/"
      - "{{BaseURL}}/api/"
      - "{{BaseURL}}/docs/"
      - "{{BaseURL}}/static/"
      - "{{BaseURL}}/test/"
