      - "{{BaseURL}}/.env.old"
      - "{{BaseURL}}/.env~"
      - "{{BaseURL}}/.env.default"
      - "{{BaseURL}}/opt/app/.env"
      - "{{BaseURL}}/home/user/.env"
    
      # Configuration and backup files
      - "{{BaseURL}}/index.php.bak"
      - "{{BaseURL}}/config.old"
      - "{{BaseURL}}/config.bak"
      - "{{BaseURL}}/database.sql.gz"
      - "{{BaseURL}}/database_backup.sql"
