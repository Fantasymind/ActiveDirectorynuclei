      - "{{BaseURL}}/config.yaml"
      - "{{BaseURL}}/config.yml"
      - "{{BaseURL}}/config.ini"
      - "{{BaseURL}}/config.xml"
      - "{{BaseURL}}/config.db"
      - "{{BaseURL}}/configuration.php"
      - "{{BaseURL}}/database.yml"
      - "{{BaseURL}}/database.json"
      - "{{BaseURL}}/database.ini"
      - "{{BaseURL}}/database.xml"
      - "{{BaseURL}}/local.config"
      - "{{BaseURL}}/web.config"
      - "{{BaseURL}}/application.properties"
